<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Sigilo">
  <title>Sigilo</title>
  <defs>
    <linearGradient id="sigilo-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D5BE3"/>
      <stop offset="1" stop-color="#1A3BAE"/>
    </linearGradient>
  </defs>
  <!-- Fondo: azul institucional del tema -->
  <rect width="64" height="64" rx="14" fill="url(#sigilo-bg)"/>
  <!-- Boleta marcada -->
  <rect x="21" y="9" width="22" height="25" rx="3" fill="#FFFFFF"/>
  <path d="M26.5 21l4.2 4.2L38 17.5" fill="none" stroke="#1E47C8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Urna -->
  <rect x="11" y="33" width="42" height="21" rx="4.5" fill="#FFFFFF"/>
  <!-- Ranura: la boleta entra en la urna -->
  <rect x="17" y="30.5" width="30" height="4.5" rx="2.25" fill="#0F2A80"/>
  <!-- Cerradura: voto secreto -->
  <circle cx="32" cy="41.6" r="3.3" fill="#1E47C8"/>
  <rect x="30.55" y="42.8" width="2.9" height="6.2" rx="1.2" fill="#1E47C8"/>
</svg>
