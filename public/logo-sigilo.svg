<svg xmlns="http://www.w3.org/2000/svg" width="320" height="72" viewBox="0 0 320 72" role="img" aria-label="Sigilo, votación anónima">
  <title>Sigilo · Votación anónima</title>
  <style>
    .wordmark { fill: #101828; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.8px; }
    .tagline  { fill: #5B6475; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 2.2px; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #E7E9EF; }
      .tagline  { fill: #9AA3B2; }
    }
  </style>
  <defs>
    <linearGradient id="sigilo-logo-bg" x1="4" y1="4" x2="68" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D5BE3"/>
      <stop offset="1" stop-color="#1A3BAE"/>
    </linearGradient>
  </defs>
  <!-- Isotipo: el mismo dibujo del favicon -->
  <g transform="translate(4 4)">
